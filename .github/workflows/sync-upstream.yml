name: Sync Upstream (T3 Code)

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    name: Sync with pingdotgg/t3code
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git || true
          git fetch upstream main

      - name: Merge Upstream Changes
        run: |
          git merge upstream/main -m "chore(sync): merge upstream pingdotgg/t3code main" || {
            echo "Merge conflict detected during upstream sync. Please review manually."
            exit 1
          }

      - name: Push Changes
        run: |
          git push origin main
